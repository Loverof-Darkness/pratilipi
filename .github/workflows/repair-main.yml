name: One-time repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix history helper name
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text()
          s = s.replace('function history()', 'function getHistory()')
          s = s.replace('history()', 'getHistory()')
          s = s.replace('history.replaceState', 'globalThis.history.replaceState')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix browser history helper naming"
          git push
